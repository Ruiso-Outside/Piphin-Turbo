<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: piphin:; style-src 'self' 'unsafe-inline' piphin:; script-src 'self'; font-src 'self' data: piphin:">
  <title>Piphin Turbo</title>
  <link rel="stylesheet" href="piphin://ui/kit.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="in-hub">
  <nav class="p-subnav">
    <button class="nav active" data-tab="home"><i class="i i-gauge"></i>Início</button>
    <button class="nav" data-tab="clean"><i class="i i-brush"></i>Limpeza</button>
    <button class="nav" data-tab="games"><i class="i i-gamepad-2"></i>Jogos</button>
    <button class="nav" data-tab="startup"><i class="i i-power"></i>Inicialização</button>
    <button class="nav" data-tab="procs"><i class="i i-activity"></i>Programas abertos</button>
    <button class="nav" data-tab="history"><i class="i i-history"></i>Histórico</button>
    <div class="grow"></div>
    <span class="turbo-pill" id="turboPill" hidden><i class="i i-rocket"></i>Modo Turbo ligado</span>
  </nav>
  <main id="content"></main>
  <div class="busy" id="busy" hidden><div class="busy-box"><span class="spin"></span><b id="busyTitle">Trabalhando...</b><span id="busyText"></span></div></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="js/app.js"></script>
</body>
</html>
